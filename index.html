<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eduplan</title>
    <link rel="stylesheet" href="style.css">
    <!--importando fontes-->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

</head>
<body>
    <!-- <header> é uma tag semântica: ela existe especificamente para marcar o cabeçalho do site.
    class="header" conecta essa tag com o CSS -->
    <header class="header">
        <!-- Essa div é só um "envelope" interno, usado para limitar a largura do conteúdo e organizar os itens com Flexbox -->
        <div class="header-inner">
            <a href="#" class="logo">
                <img src="./assets/image.png" alt="Logo do Eduplan">

                <h2 style="color: #1D4ED8;">Cine <span style="color: #16A34A;">Flow</span></h2>
            </a>

            <ul class="nav" id="nav">
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Recursos</a></li>
                <li><a href="#">Beneficios</a></li>
                <li><a href="#">Sobre</a></li>
                <li><a href="#">Depoimentos</a></li>
                <li><a href="#">Contato</a></li>  
            </ul>

            <div class="actions">
                <a href="#" class="btn btn-entrar">Entrar</a>
                <a href="#" class="btn btn-cadastrar">Cadastrar</a>
            </div>
        </div>
    </header>
</body>
</html>
