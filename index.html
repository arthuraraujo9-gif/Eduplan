<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eduplan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

       <!-- <herder> é uma tag semantica: 
       ela existe especificamente para marcar o
        cabeçalho do site. class="header" 
        conecta essa tag com o css-->
        <header class="header">
        <!-- essa div é só um "envelopo"
          interno, usado para limitar a
           largura do conteúdo e organizar
            os itens com flexbox -->
        <div class="herder-inner">
            <a href="#" class="log">
                <img src="./assets/image.png" alt="logo do Eduplan">

                <h2 style="color: #1D4ED8;">Edu <span
                 style="color: #16A34A;">Plan</span></h2>
             </a>

             <ul class="nav" id="nav"> 
            
               <li><a href="#">inicio</a></li>
               <li><a href="#">Recursos</a></li>
               <li><a href="#">Beneficios</a></li>
               <li><a href="#">Sobre</a></li>
               <li><a href="#">Depoimentos</a></li>
               <li><a href="#">Contatos</a></li>
             </ul>

             <div class="actions">
                <a href="#" class="btn btn-entrar">Entrar</a>
                <a href="#" class="btn btn-Cadastrar">Cadastrar</a>
             </div>
         </div>
     </header>
</body>
</html>
